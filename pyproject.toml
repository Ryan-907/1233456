[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-conductor"
version = "1.0.0"
description = "Deterministic Contextual Integrity gate for LLM-based document retrieval, with the label-substitution study"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["core", "world", "pipeline", "evaluation"]
